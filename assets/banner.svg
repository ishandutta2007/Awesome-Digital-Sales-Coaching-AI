<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="light-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes float-fast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-wave {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 40; }
      }
      @keyframes rotate-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes shimmer {
        0% { opacity: 0.4; }
        50% { opacity: 0.9; }
        100% { opacity: 0.4; }
      }

      .floating-card-1 { animation: float-slow 7s ease-in-out infinite; transform-origin: center; }
      .floating-card-2 { animation: float-fast 5s ease-in-out infinite; transform-origin: center; }
      .wave-line { animation: pulse-wave 4s ease-in-out infinite; stroke-dasharray: 10 15; }
      .rotating-gear { animation: rotate-ring 25s linear infinite; transform-origin: 1050px 100px; }
      .shimmer-text { animation: shimmer 3s ease-in-out infinite; }
      .badge-bg { fill: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Decorative Glowing Orbs (Behind content) -->
  <circle cx="150" cy="100" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="300" r="220" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="250" fill="#db2777" opacity="0.08" filter="url(#glow)"/>

  <!-- Dynamic Wave Lines (Background Layer) -->
  <path d="M-50 320 C 300 260, 500 380, 850 300 C 1050 250, 1200 330, 1250 310" fill="none" stroke="url(#accent-purple)" stroke-width="2.5" opacity="0.4" class="wave-line"/>
  <path d="M-50 280 C 250 340, 600 220, 900 340 C 1100 380, 1200 270, 1250 290" fill="none" stroke="url(#accent-cyan)" stroke-width="2" opacity="0.3" class="wave-line" style="animation-delay: -2s;"/>

  <!-- Rotating Tech Ring (Top Right Background) -->
  <g class="rotating-gear" opacity="0.25">
    <circle cx="1050" cy="100" r="70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle cx="1050" cy="100" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Decorative Floating UI Pill Cards (Side Graphics - Keep Clear of Foreground Center Text) -->
  <!-- Left Decorative Pill Card -->
  <g class="floating-card-1" transform="translate(60, 240)">
    <rect width="210" height="65" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#8b5cf6" opacity="0.3"/>
    <text x="35" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#c084fc">🎙️</text>
    <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">AI Roleplay Practice</text>
    <text x="65" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Real-time Call Scoring</text>
  </g>

  <!-- Right Decorative Pill Card -->
  <g class="floating-card-2" transform="translate(930, 210)">
    <rect width="210" height="65" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="35" cy="32" r="16" fill="#06b6d4" opacity="0.3"/>
    <text x="35" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle" fill="#38bdf8">🚀</text>
    <text x="65" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Conversation Intel</text>
    <text x="65" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Objection Handling AI</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed Crisp & Unobscured) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Top Category Badge -->
    <rect x="-140" y="-85" width="280" height="32" rx="16" fill="url(#card-grad)" stroke="url(#accent-purple)" stroke-width="1.2" class="shimmer-text"/>
    <text x="0" y="-64" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">CURATED AI ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#light-glow)">
      Awesome Digital Sales Coaching AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
      Top SaaS Platforms &amp; Open-Source Projects for AI Pitch Practice, Roleplays &amp; Call Coaching
    </text>

    <!-- Tags Row -->
    <g transform="translate(0, 95)">
      <!-- Tag 1 -->
      <rect x="-240" y="-14" width="140" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
      <text x="-170" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ddd6fe">🤖 AI Roleplay</text>

      <!-- Tag 2 -->
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(6, 182, 212, 0.2)" stroke="#06b6d4" stroke-width="1"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">💬 Conversation Intel</text>

      <!-- Tag 3 -->
      <rect x="100" y="-14" width="140" height="28" rx="14" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="1"/>
      <text x="170" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">📊 Call Scoring</text>
    </g>
  </g>
</svg>
